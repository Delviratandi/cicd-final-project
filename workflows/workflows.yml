name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Langkah Lint dengan ESLint
      run: npm run lint # Menggunakan ESLint untuk pengecekan kode

    - name: Jalankan uji unit dengan Jest-test
      run: npm test # Menggunakan Jest untuk unit testing
