apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: final-project-tasks
spec:
  workspaces:
    - name: source
  steps:
    - name: tugas-pembersihan
      image: alpine:latest
      script: |
        echo "Memulai tugas pembersihan workspace..."
        rm -rf $(workspaces.source.path)/*
        echo "Workspace berhasil dibersihkan."

    - name: tugas-jest-test
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        echo "Menginstal dependensi untuk pengujian..."
        npm install
        echo "Menjalankan uji unit dengan Jest..."
        npm test
